services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zacma-dealership:latest
    container_name: zacma_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "Zacma Dealership & Marketplace"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-zacma_production}
      DB_USERNAME: ${DB_USERNAME:-zacma_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_db_password}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage_data:/var/www/html/storage/app/public

  db:
    image: postgres:16-alpine
    container_name: zacma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zacma_production}
      POSTGRES_USER: ${DB_USERNAME:-zacma_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zacma_user} -d ${DB_DATABASE:-zacma_production}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zacma_redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  storage_data:

